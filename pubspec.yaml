name: imaji_test_hang
description: >-
  Fails a Flutter test suite fast on the patterns that deadlock the test
  isolate, instead of letting the run hang with no output until the CI job
  timeout kills it.
version: 0.1.0
repository: https://github.com/saimskywalker/flutter-imaji-test-hang
issue_tracker: https://github.com/saimskywalker/flutter-imaji-test-hang/issues

environment:
  sdk: ^3.5.0

dependencies:
  args: ^2.6.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0

executables:
  imaji_test_hang: imaji_test_hang
  # The name this tool had before it was renamed, kept so existing CI steps and
  # scripts that call `test_hang_guard` keep working.
  test_hang_guard: imaji_test_hang
